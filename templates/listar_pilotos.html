{% extends "base.html" %}
{% block content %}
<h2>Listado de pilotos</h2>
<a href="{{ url_for('agregar_piloto') }}" class="btn btn-success mb-3">Agregar piloto</a>
<table class="table table-bordered">
    <thead>
        <tr><th>ID</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Historial educativo</th><th>Acciones</th></tr>
    </thead>
    <tbody>
        {% for p in pilotos %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.direccion }}</td>
            <td>{{ p.telefono }}</td>
            <td>{{ p.historial_educativo }}</td>
            <td>
                <a href="{{ url_for('editar_piloto', piloto_id=p.id) }}" class="btn btn-sm btn-primary">Editar</a>
                <a href="{{ url_for('eliminar_piloto', piloto_id=p.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este piloto? Se desasignará de los buses.')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
